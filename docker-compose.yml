version: '3.8'

services:
  # Nginx Reverse Proxy
  webserver:
    image: nginx:alpine
    container_name: jihc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
      - nextjs
    networks:
      - jihc_network

  # Laravel Backend (PHP-FPM)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jihc_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - jihc_network

  # Frontend Next.js
  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jihc_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-kNGN+hQpB3S4ELzKlFcEgc1aLEBedSo9aD5T+7NY2A8=}
      - GROQ_API_KEY=${GROQ_API_KEY:-your_groq_api_key_here}
    depends_on:
      - app
    networks:
      - jihc_network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: jihc_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-jihc_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-jihc_user}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - jihc_network

  # Redis Cache & Queue
  redis:
    image: redis:alpine
    container_name: jihc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - jihc_network

volumes:
  dbdata:
  redisdata:

networks:
  jihc_network:
    driver: bridge
